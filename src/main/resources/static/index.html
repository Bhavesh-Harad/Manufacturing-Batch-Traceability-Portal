<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manufacturing Batch Traceability Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .dashboard-card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-industry me-2"></i>Batch Traceability Portal</a>
    </div>
</nav>

<div class="container">
    <!-- Dashboard Summary and Chart -->
    <div class="row mb-4" id="dashboard-summary">
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-6">
                    <div class="card dashboard-card bg-primary text-white mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Total Batches</h5>
                            <h2 id="total-count">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card dashboard-card bg-warning text-dark mb-3">
                        <div class="card-body">
                            <h5 class="card-title">In Production</h5>
                            <h2 id="production-count">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card dashboard-card bg-info text-white mb-3">
                        <div class="card-body">
                            <h5 class="card-title">QA Review</h5>
                            <h2 id="qa-count">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card dashboard-card bg-success text-white mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Approved</h5>
                            <h2 id="approved-count">0</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 d-flex justify-content-center align-items-center">
            <div class="card dashboard-card p-3 w-100" style="max-height: 250px;">
                <canvas id="statusChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Actions and Search -->
    <div class="row mb-3">
        <div class="col-md-6">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createBatchModal">
                <i class="fas fa-plus me-1"></i> Create New Batch
            </button>
            <button class="btn btn-success ms-2" onclick="exportToCSV()">
                <i class="fas fa-file-csv me-1"></i> Export Data
            </button>
        </div>
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by Product Name or Batch ID...">
                <button class="btn btn-outline-secondary" type="button" onclick="searchBatches()"><i class="fas fa-search"></i></button>
                <button class="btn btn-outline-secondary" type="button" onclick="loadBatches()"><i class="fas fa-sync"></i></button>
            </div>
        </div>
    </div>

    <!-- Batches Table -->
    <div class="table-container">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Batch ID (Trace)</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="batches-tbody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Create Batch Modal -->
<div class="modal fade" id="createBatchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Register New Batch</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="createBatchForm">
          <div class="mb-3">
            <label for="productName" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="productName" required>
          </div>
          <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantity" required min="1">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="createBatch()">Save Batch</button>
      </div>
    </div>
  </div>
</div>

<!-- Audit Log Modal -->
<div class="modal fade" id="auditLogModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title"><i class="fas fa-history me-2"></i>Batch Traceability Timeline</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h6 id="auditBatchTitle" class="fw-bold mb-4"></h6>
        <div class="timeline ps-3 border-start border-3 border-primary" id="auditTimeline">
            <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
